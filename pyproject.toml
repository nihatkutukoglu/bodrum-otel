[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bodrum-hotel-intelligence"
version = "0.1.0"
description = "Bodrum otel ve destinasyon veri analizi projesi"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "matplotlib>=3.7",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "requests>=2.31",
  "openpyxl>=3.1",
  "nbformat>=5.9",
  "nbclient>=0.9",
  "ipykernel>=6.25",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "nbconvert>=7.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
